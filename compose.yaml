# Development stack: docker compose --env-file .env.docker up --watch
# Containers use service names (postgres, kafka), rather than your PC address.
# Watch actions: sync = copy files; sync+restart = copy and restart that service;
# rebuild = rebuild only the service whose dependency or Dockerfile changed.
name: actionhub-dev

services:
  # Stores users, workflows, and execution records. The volume keeps data after restarts.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: actionhub
      POSTGRES_PASSWORD: actionhub_dev
      POSTGRES_DB: actionhub
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U actionhub -d actionhub"]
      interval: 3s
      timeout: 3s
      retries: 30

  # One-time task: give Kafka permission to write to its saved data folder.
  kafka-volume-init:
    image: apache/kafka:3.9.1
    user: "0:0"
    entrypoint: [sh, -c, "chown 1000:1000 /kafka-data"]
    volumes:
      - kafka-data:/kafka-data

  # Message queue between the processor and worker. These settings run one development broker.
  kafka:
    image: apache/kafka:3.9.1
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test:
        [
          CMD-SHELL,
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  # One-time task: create the zap-events topic if it does not exist.
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [/opt/kafka/bin/kafka-topics.sh]
    command:
      [
        --bootstrap-server,
        "kafka:9092",
        --create,
        --if-not-exists,
        --topic,
        zap-events,
        --partitions,
        "1",
        --replication-factor,
        "1",
      ]

  # One-time task: apply database migrations and seed the initial trigger/action types.
  db-init:
    image: actionhub-primary-backend-dev
    pull_policy: never
    environment:
      DATABASE_URL: postgresql://actionhub:actionhub_dev@postgres:5432/actionhub
    depends_on:
      postgres:
        condition: service_healthy
    command: [sh, -c, "npx prisma migrate deploy --config prisma.config.ts && npx tsx seed.ts"]

  # API for login and managing workflows. Waits for database setup to finish.
  primary-backend:
    image: actionhub-primary-backend-dev
    build:
      context: ./primary-backend
      target: development
    init: true
    environment:
      DATABASE_URL: postgresql://actionhub:actionhub_dev@postgres:5432/actionhub
      PORT: 3000
      APP_ENV: ${APP_ENV:-production}
      JWT_PASSWORD: ${JWT_PASSWORD:?Set JWT_PASSWORD in .env.docker}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?Set CREDENTIAL_ENCRYPTION_KEY in .env.docker}
      GITHUB_SECRETS: ${GITHUB_SECRETS:-}
      GITHUB_SETUP_WORKFLOW_ID: ${GITHUB_SETUP_WORKFLOW_ID:-}
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          'fetch("http://127.0.0.1:3000/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    develop:
      watch:
        - action: sync+restart
          path: ./primary-backend/src
          target: /app/src
          initial_sync: true
          ignore: [generated/]
        - action: sync
          path: ./primary-backend/tests
          target: /app/tests
          initial_sync: true
        - action: sync
          path: ./primary-backend/jest.config.cjs
          target: /app/jest.config.cjs
          initial_sync: true
        - action: sync
          path: ./primary-backend/.eslintrc.json
          target: /app/.eslintrc.json
          initial_sync: true
        - action: sync
          path: ./primary-backend/.prettierrc.json
          target: /app/.prettierrc.json
          initial_sync: true
        - action: sync
          path: ./primary-backend/.prettierignore
          target: /app/.prettierignore
          initial_sync: true
        - action: rebuild
          path: ./primary-backend/package.json
        - action: rebuild
          path: ./primary-backend/package-lock.json
        - action: rebuild
          path: ./primary-backend/Dockerfile
        - action: rebuild
          path: ./primary-backend/.dockerignore
        - action: rebuild
          path: ./primary-backend/prisma.config.ts
        - action: rebuild
          path: ./primary-backend/prisma

  # Receives webhook requests and saves workflow runs to the database.
  hooks:
    image: actionhub-hooks-dev
    build:
      context: ./hooks
      target: development
    init: true
    environment:
      DATABASE_URL: postgresql://actionhub:actionhub_dev@postgres:5432/actionhub
      PORT: 3002
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?Set CREDENTIAL_ENCRYPTION_KEY in .env.docker}
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          'fetch("http://127.0.0.1:3002/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    develop:
      watch:
        - action: sync+restart
          path: ./hooks/src
          target: /app/src
          initial_sync: true
          ignore: [generated/]
        - action: sync
          path: ./hooks/tests
          target: /app/tests
          initial_sync: true
        - action: sync
          path: ./hooks/jest.config.cjs
          target: /app/jest.config.cjs
          initial_sync: true
        - action: sync
          path: ./hooks/.eslintrc.json
          target: /app/.eslintrc.json
          initial_sync: true
        - action: sync
          path: ./hooks/.prettierrc.json
          target: /app/.prettierrc.json
          initial_sync: true
        - action: sync
          path: ./hooks/.prettierignore
          target: /app/.prettierignore
          initial_sync: true
        - action: rebuild
          path: ./hooks/package.json
        - action: rebuild
          path: ./hooks/package-lock.json
        - action: rebuild
          path: ./hooks/Dockerfile
        - action: rebuild
          path: ./hooks/.dockerignore
        - action: rebuild
          path: ./hooks/prisma.config.ts
        - action: rebuild
          path: ./hooks/prisma

  # Reads pending database events and publishes messages to Kafka.
  processor:
    image: actionhub-processor-dev
    build:
      context: ./processor
      target: development
    init: true
    environment:
      DATABASE_URL: postgresql://actionhub:actionhub_dev@postgres:5432/actionhub
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: zap-events
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    develop:
      watch:
        - action: sync+restart
          path: ./processor/src
          target: /app/src
          initial_sync: true
          ignore: [generated/]
        - action: sync
          path: ./processor/tests
          target: /app/tests
          initial_sync: true
        - action: sync
          path: ./processor/jest.config.cjs
          target: /app/jest.config.cjs
          initial_sync: true
        - action: sync
          path: ./processor/.eslintrc.json
          target: /app/.eslintrc.json
          initial_sync: true
        - action: sync
          path: ./processor/.prettierrc.json
          target: /app/.prettierrc.json
          initial_sync: true
        - action: sync
          path: ./processor/.prettierignore
          target: /app/.prettierignore
          initial_sync: true
        - action: rebuild
          path: ./processor/package.json
        - action: rebuild
          path: ./processor/package-lock.json
        - action: rebuild
          path: ./processor/Dockerfile
        - action: rebuild
          path: ./processor/.dockerignore
        - action: rebuild
          path: ./processor/prisma.config.ts
        - action: rebuild
          path: ./processor/prisma

  # Development inbox: view captured emails at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAIL_PORT:-8025}:8025"

  # Consumes Kafka messages and sends emails to the development inbox.
  worker:
    image: actionhub-worker-dev
    build:
      context: ./worker
      target: development
    init: true
    environment:
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?Set CREDENTIAL_ENCRYPTION_KEY in .env.docker}
      DATABASE_URL: postgresql://actionhub:actionhub_dev@postgres:5432/actionhub
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: zap-events
      KAFKA_GROUP_ID: main-worker
      SMTP_ENDPOINT: mailpit
      SMTP_PORT: 1025
      SMTP_AUTH: "false"
      SMTP_REQUIRE_TLS: "false"
      SMTP_FROM: workflows@actionhub.test
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    develop:
      watch:
        - action: sync+restart
          path: ./worker/src
          target: /app/src
          initial_sync: true
        - action: sync
          path: ./worker/tests
          target: /app/tests
          initial_sync: true
        - action: sync
          path: ./worker/jest.config.cjs
          target: /app/jest.config.cjs
          initial_sync: true
        - action: sync
          path: ./worker/.eslintrc.json
          target: /app/.eslintrc.json
          initial_sync: true
        - action: sync
          path: ./worker/.prettierrc.json
          target: /app/.prettierrc.json
          initial_sync: true
        - action: sync
          path: ./worker/.prettierignore
          target: /app/.prettierignore
          initial_sync: true
        - action: rebuild
          path: ./worker/package.json
        - action: rebuild
          path: ./worker/package-lock.json
        - action: rebuild
          path: ./worker/Dockerfile
        - action: rebuild
          path: ./worker/.dockerignore
        - action: rebuild
          path: ./worker/prisma
        - action: rebuild
          path: ./worker/prisma.config.ts
        - action: rebuild
          path: ./worker/scripts

  # Next.js interface. Empty public URLs send browser requests through the proxy.
  frontend:
    image: actionhub-frontend-dev
    build:
      context: ./frontend
      target: development
    init: true
    environment:
      NEXT_PUBLIC_BACKEND_URL: ""
      NEXT_PUBLIC_HOOKS_URL: ""
      WATCHPACK_POLLING: "true"
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          'fetch("http://127.0.0.1:3001/").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    develop:
      watch:
        - action: sync
          path: ./frontend/app
          target: /app/app
          initial_sync: true
        - action: sync
          path: ./frontend/components
          target: /app/components
          initial_sync: true
        - action: sync
          path: ./frontend/public
          target: /app/public
          initial_sync: true
        - action: sync+restart
          path: ./frontend/next.config.mjs
          target: /app/next.config.mjs
        - action: sync+restart
          path: ./frontend/tailwind.config.ts
          target: /app/tailwind.config.ts
        - action: sync+restart
          path: ./frontend/postcss.config.mjs
          target: /app/postcss.config.mjs
        - action: sync+restart
          path: ./frontend/tsconfig.json
          target: /app/tsconfig.json
        - action: sync
          path: ./frontend/tests
          target: /app/tests
          initial_sync: true
        - action: sync
          path: ./frontend/jest.config.cjs
          target: /app/jest.config.cjs
          initial_sync: true
        - action: sync
          path: ./frontend/.eslintrc.json
          target: /app/.eslintrc.json
          initial_sync: true
        - action: sync
          path: ./frontend/.prettierrc.json
          target: /app/.prettierrc.json
          initial_sync: true
        - action: sync
          path: ./frontend/.prettierignore
          target: /app/.prettierignore
          initial_sync: true
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json
        - action: rebuild
          path: ./frontend/Dockerfile
        - action: rebuild
          path: ./frontend/.dockerignore

  # Browser entry point at http://localhost:8080. Routes UI, API, and webhook requests.
  proxy:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      primary-backend:
        condition: service_healthy
      hooks:
        condition: service_healthy

# Persistent application data. Do not use down --volumes unless you want to delete it.
volumes:
  postgres-data:
  kafka-data:
