name: Unit tests and build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: ${{ matrix.service }} unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, primary-backend, hooks, processor, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build isolated development/test image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          target: development
          load: true
          push: false
          tags: actionhub-${{ matrix.service }}-ci:latest
          cache-from: type=gha,scope=unit-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=unit-${{ matrix.service }}
      - name: Jest unit tests and coverage (network disabled)
        run: docker run --network none --name unit-tests actionhub-${{ matrix.service }}-ci:latest npm run test:ci
      - name: TypeScript checks (network disabled)
        run: docker run --rm --network none actionhub-${{ matrix.service }}-ci:latest npm run typecheck
      - name: Verify production build
        # Placeholder is used for Prisma code generation only. No database is started.
        run: docker run --rm -e DATABASE_URL=postgresql://build:build@unused:5432/build_only actionhub-${{ matrix.service }}-ci:latest npm run build
      - name: Extract coverage
        if: always()
        run: docker cp unit-tests:/app/coverage ./coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-${{ matrix.service }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove test container
        if: always()
        run: docker rm -f unit-tests || true
