# GitHub runs these checks for pull requests and pushes to main.
# Each service gets its own job. Unit tests use no database, Kafka, or network.
name: Quality checks and unit tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel an older run when a newer commit arrives on the same branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: ${{ matrix.service }} quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # Repeat the steps below once for each service.
      matrix:
        service: [frontend, primary-backend, hooks, processor, worker]
    steps:
      # Download the repository and prepare Docker image building.
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Reuse cached layers; install dependencies only when their files change.
      - name: Build isolated development/test image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          target: development
          load: true
          push: false
          tags: actionhub-${{ matrix.service }}-ci:latest
          cache-from: type=gha,scope=unit-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=unit-${{ matrix.service }}
      # Check code style, formatting, tests, types, and the production build.
      - name: ESLint (network disabled)
        run: docker run --rm --network none actionhub-${{ matrix.service }}-ci:latest npm run lint
      - name: Prettier module check (network disabled)
        run: docker run --rm --network none actionhub-${{ matrix.service }}-ci:latest npm run format:check
      - name: Prettier repository check (frontend job only)
        if: matrix.service == 'frontend'
        run: >-
          docker run --rm --network none
          --mount type=bind,source="$PWD",target=/workspace,readonly
          --workdir /workspace actionhub-frontend-ci:latest
          /app/node_modules/.bin/prettier --check .
      - name: Jest unit tests and coverage (network disabled)
        id: unit_tests
        run: docker run --network none --name unit-tests actionhub-${{ matrix.service }}-ci:latest npm run test:ci
      - name: TypeScript checks (network disabled)
        run: docker run --rm --network none actionhub-${{ matrix.service }}-ci:latest npm run typecheck
      - name: Verify production build
        # Placeholder is used for Prisma code generation only. No database is started.
        run: docker run --rm -e DATABASE_URL=postgresql://build:build@unused:5432/build_only actionhub-${{ matrix.service }}-ci:latest npm run build
      # Save coverage in the GitHub run, even if a later check fails.
      - name: Extract coverage
        if: always() && steps.unit_tests.outcome != 'skipped'
        run: docker cp unit-tests:/app/coverage ./coverage
      - name: Upload coverage report
        if: always() && steps.unit_tests.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-${{ matrix.service }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove test container
        if: always()
        run: docker rm -f unit-tests || true
